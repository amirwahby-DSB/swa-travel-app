<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SWA Travel — كل عروض السفر في مكان واحد. قارن أفضل عروض الطيران والفنادق والليموزين من شركات سياحة موثوقة.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Open Graph / social share preview (WhatsApp, Facebook, etc.) -->
  <meta property="og:title" content="SWA Travel — All Your Travel Offers in One Place">
  <meta property="og:description" content="كل عروض السفر في مكان واحد — قارن أفضل عروض الطيران والفنادق والليموزين من شركات سياحة موثوقة.">
  <meta property="og:image" content="https://swa-travel-app.web.app/social_preview.png">
  <meta property="og:url" content="https://swa-travel-app.web.app/">
  <meta property="og:type" content="website">

  <!-- Twitter Card (some apps/platforms read this instead of Open Graph) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SWA Travel — All Your Travel Offers in One Place">
  <meta name="twitter:description" content="كل عروض السفر في مكان واحد — قارن أفضل عروض الطيران والفنادق والليموزين من شركات سياحة موثوقة.">
  <meta name="twitter:image" content="https://swa-travel-app.web.app/social_preview.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SWA Travel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SWA Travel — All Your Travel Offers in One Place</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Analytics: tracks page views and visitor counts. Loaded
       from the head so it fires as early as possible, before Flutter's
       own scripts start loading. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H08NWCHYTF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-H08NWCHYTF');
  </script>
</head>
<body>
  <!--
    Force the HTML renderer instead of CanvasKit. CanvasKit has a known
    engine-level bug where laying out certain text (in our case, the Arabic
    hero title) at very narrow widths — like a real phone screen — throws
    "Null check operator used on a null value" and the whole app crashes
    before it can draw a single frame. The HTML renderer draws text using
    the browser's own text engine instead, which sidesteps that bug
    entirely, and is also a smaller download (helpful on slow connections).
  -->
  <script>
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
